<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src pet: data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>DSH 桌宠</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="stage">
    <div id="sessions" class="sessions" hidden>
      <div class="sessions-head">
        <div class="sessions-title">
          <span class="sessions-lights" aria-hidden="true"><i class="done"></i><i class="waiting"></i><i class="failed"></i></span>
          <span class="sessions-title-text">会话状态</span>
          <span id="sessionCount" class="sessions-count">0</span>
        </div>
        <div id="sessionBar" class="session-bar" hidden></div>
        <button id="sessionsToggle" class="sessions-icon-btn" type="button" title="收起" aria-label="收起会话状态">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div id="sessionToast" class="session-toast" hidden></div>
      <div id="sessionList" class="session-list"></div>
      <div class="sessions-foot"><button id="sessionsClear" class="sessions-clear" type="button">清空已完结提醒</button></div>
    </div>
    <div id="bubble" class="bubble" hidden></div>
    <div id="pet" class="pet" title=""></div>
    <div id="debug" class="debug" hidden></div>
  </div>
  <script src="./bridge.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>

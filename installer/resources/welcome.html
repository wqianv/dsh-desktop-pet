<h1>安装 DSH 桌宠</h1>
<p>这个安装包会把桌宠放进 <b>/Applications</b>，并把 DSH 插件装进当前用户的 DSH profile。安装完成后，打开 DSH 桌宠会自动出现。</p>
<p>适用于 Apple Silicon Mac，需要已经安装 DeepSeek Harness。</p>
<div class="ok">安装器会退出并重启 DSH 一次；如果 DSH 里有未保存的输入，请先处理。</div>
